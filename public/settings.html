<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// See index.html for why this runs inline, before the stylesheet.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge - Settings</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Settings</h1>
    <a href="index.html">&larr; Back to inventory</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <section class="settings-section">
      <h2>Appearance</h2>
      <p class="settings-desc">Auto matches your browser or device's own light/dark setting.</p>
      <div class="chip-row" id="themeChips">
        <button class="chip" type="button" data-theme="auto">Auto</button>
        <button class="chip" type="button" data-theme="light">Light</button>
        <button class="chip" type="button" data-theme="dark">Dark</button>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
