<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// Applies a manually-chosen theme (set on the Settings page) before the
// page paints, so there's no flash of the wrong theme. Left alone (no
// data-theme attribute) means "Auto" - follow the browser/OS setting via
// the prefers-color-scheme rules in styles.css.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>BackOfFridge</h1>
    <div id="stats" class="stats"></div>
    <a href="list.html">Shopping list</a>
    <a href="glance.html">At a glance</a>
    <a href="locations.html">Manage locations</a>
    <a href="tags.html">Manage tags</a>
    <a href="settings.html">Settings</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <div class="view-toggle" id="viewToggle" role="group" aria-label="List view">
      <button type="button" data-view="grouped" class="active">By location</button>
      <button type="button" data-view="flat">All items</button>
    </div>

    <div class="chip-row" id="statusChips">
      <button class="chip" data-filter="all" type="button">All</button>
      <button class="chip active" data-filter="active" type="button">Active</button>
      <button class="chip" data-filter="soon" type="button">Expiring soon</button>
      <button class="chip" data-filter="low" type="button">Low stock</button>
    </div>

    <div class="filter-bar-row">
      <input type="search" id="searchBox" class="search-input" placeholder="Search..." aria-label="Search">
      <button class="disclosure-toggle" type="button" data-toggle="filterPanel">Filters ▾</button>
      <button class="reset-filters-btn" type="button" id="resetFiltersBtn" hidden>Reset</button>
    </div>
    <div class="filter-panel" hidden id="filterPanel">
      <label>Location <select id="filterLocation"><option value="">All</option></select></label>
      <label>Tag <select id="filterTag"><option value="">All</option></select></label>
      <label>Sort
        <select id="sortBy">
          <option value="">Default</option>
          <option value="recent">Recently added</option>
          <option value="name">Name</option>
        </select>
      </label>
    </div>

    <div class="add-shell with-panel" id="addShell">
      <div class="list-column">
        <div class="bottombar">
          <form id="quickAddForm">
            <input type="text" id="quickAddInput" placeholder="Quick add… milk, 1 gallon, fridge, dairy (tap the mic to dictate)">
          </form>
          <button type="button" id="scanBarBtn" class="secondary" aria-label="Scan a barcode" title="Scan a barcode"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
          <button type="button" id="openSheetBtn" aria-label="Add item">+</button>
        </div>

        <div id="itemGroups"></div>
      </div>

      <!-- The quick entry card (features.md, "Quick entry card"): one form
           for every way of adding or changing an item. -->
      <div class="sheet entry-card" id="itemSheet" hidden>
        <div class="card-head">
          <button class="sheet-close" type="button" id="closeSheetBtn" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <h2 id="sheetTitle">Log a purchase</h2>
          <button type="button" id="tripCount" class="trip-count" hidden></button>
        </div>
        <form id="itemForm" class="card-form">
          <div class="card-body">
            <div class="barcode-row">
              <input type="text" id="f-barcode" placeholder="Barcode (type or scan)" inputmode="numeric" autocomplete="off" aria-label="Barcode">
              <button type="button" id="scanBtn" class="scan-btn"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg> Scan</button>
              <!-- Opens the phone's own camera; the photo is read on the server. -->
              <input type="file" id="f-scan-file" accept="image/*" capture="environment" class="offscreen" tabindex="-1" aria-hidden="true">
            </div>
            <div id="scanStatus" class="scan-status" role="status" hidden></div>
            <div id="scanMatch" class="scan-match" hidden></div>

            <div class="product-box">
              <div id="productSource" class="product-source" hidden></div>
              <input type="text" id="f-name" placeholder="Item name" required class="name-input" aria-label="Item name" autocomplete="off">
              <div id="productDetail" class="product-detail" hidden></div>
              <div class="qty-row">
                <label for="f-quantity">Qty</label>
                <button type="button" class="step-btn" id="qtyMinus" aria-label="One fewer">−</button>
                <input type="text" id="f-quantity" inputmode="decimal" value="1" autocomplete="off">
                <button type="button" class="step-btn" id="qtyPlus" aria-label="One more">+</button>
                <span id="qtyUnit" class="qty-unit"></span>
              </div>
              <label class="fill-row hidden" id="f-fill-wrap">Open one, % full <input type="number" id="f-fillpercent" placeholder="Fill %" min="0" max="100"></label>
            </div>

            <section class="card-section" aria-labelledby="whereHeading">
              <div class="section-head">
                <h3 id="whereHeading">Where</h3>
                <span id="locHint" class="section-hint">Tap where it goes</span>
              </div>
              <div class="loc-tiles" id="locTiles" role="group" aria-labelledby="whereHeading"></div>
              <!-- The tiles above drive this; it's what the rest of the code reads. -->
              <select id="f-location-select" class="hidden" aria-hidden="true" tabindex="-1">
                <option value="">Select location...</option>
                <option value="__new__">+ Add new location...</option>
              </select>
              <input type="text" id="f-location-new" placeholder="New location name" class="card-input hidden">
            </section>

            <section class="card-section" aria-labelledby="expHeading">
              <div class="section-head">
                <h3 id="expHeading" class="grow">Expires</h3>
                <div class="seg" role="group" aria-label="Expiry style">
                  <button type="button" id="expTabApprox" aria-pressed="false">Approx</button>
                  <button type="button" id="expTabExact" aria-pressed="false">Exact date</button>
                </div>
              </div>
              <div id="expSummary" class="exp-summary" aria-live="polite"></div>
              <!-- The chips and the picker set this; it's what the rest of the code reads. -->
              <input type="hidden" id="f-expiration">
              <div id="expApprox" class="exp-grid cols-4"></div>
              <div id="expExact" hidden>
                <div id="expCrumbs" class="exp-crumbs"></div>
                <div id="expPicker"></div>
              </div>
            </section>

            <button class="disclosure-toggle" type="button" data-toggle="moreFields">More details (unit, category, tag, notes) ▾</button>
            <div class="form-grid" hidden id="moreFields">
              <label>Unit <input type="text" id="f-unit" placeholder="oz, lb, box..."></label>
              <label>Category
                <select id="f-category">
                  <option value="perishable">Perishable</option>
                  <option value="nonperishable">Non-perishable</option>
                </select>
              </label>
              <label class="full">Tag
                <select id="f-tag-select">
                  <option value="">Select tag...</option>
                  <option value="__new__">+ Add new tag...</option>
                </select>
              </label>
              <input type="text" id="f-tag-new" placeholder="New tag name" class="hidden full">
              <label class="full">Purchased <input type="date" id="f-purchase"></label>
              <input type="text" id="f-notes" placeholder="Notes" class="full" aria-label="Notes">
            </div>
          </div>

          <div class="card-foot">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="save-next-btn" id="saveNextBtn">Save &amp; scan next</button>
          </div>
        </form>

        <!-- This trip: everything saved since the trip began, newest at the
             top, as a check before the bags are put away. -->
        <div id="tripView" class="card-form" hidden>
          <div class="card-body">
            <p id="tripEmpty" class="trip-empty" hidden>Nothing saved this trip yet.</p>
            <!-- From the shopping list: not got yet. -->
            <section id="tripTodo" class="card-section" hidden>
              <h3 class="trip-subhead">Still to get <span id="tripTodoCount" class="section-hint"></span></h3>
              <ul id="tripTodoList" class="plain-rows"></ul>
            </section>
            <h3 id="tripGotHead" class="trip-subhead" hidden>Got</h3>
            <ol id="tripList" class="trip-list" reversed></ol>
          </div>
          <div class="card-foot">
            <button type="button" id="endTripBtn" class="save-btn">End trip</button>
            <button type="button" id="backToAddBtn" class="save-next-btn">Add more</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
