<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// Applies a manually-chosen theme (set on the Settings page) before the
// page paints, so there's no flash of the wrong theme. Left alone (no
// data-theme attribute) means "Auto" - follow the browser/OS setting via
// the prefers-color-scheme rules in styles.css.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>BackOfFridge</h1>
    <div id="stats" class="stats"></div>
    <a href="glance.html">At a glance</a>
    <a href="locations.html">Manage locations</a>
    <a href="tags.html">Manage tags</a>
    <a href="settings.html">Settings</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <div class="view-toggle" id="viewToggle" role="group" aria-label="List view">
      <button type="button" data-view="grouped" class="active">By location</button>
      <button type="button" data-view="flat">All items</button>
    </div>

    <div class="chip-row" id="statusChips">
      <button class="chip" data-filter="all" type="button">All</button>
      <button class="chip active" data-filter="active" type="button">Active</button>
      <button class="chip" data-filter="soon" type="button">Expiring soon</button>
      <button class="chip" data-filter="low" type="button">Low stock</button>
    </div>

    <div class="filter-bar-row">
      <input type="search" id="searchBox" class="search-input" placeholder="Search..." aria-label="Search">
      <button class="disclosure-toggle" type="button" data-toggle="filterPanel">Filters ▾</button>
      <button class="reset-filters-btn" type="button" id="resetFiltersBtn" hidden>Reset</button>
    </div>
    <div class="filter-panel" hidden id="filterPanel">
      <label>Location <select id="filterLocation"><option value="">All</option></select></label>
      <label>Tag <select id="filterTag"><option value="">All</option></select></label>
      <label>Sort
        <select id="sortBy">
          <option value="">Default</option>
          <option value="recent">Recently added</option>
          <option value="name">Name</option>
        </select>
      </label>
    </div>

    <div class="add-shell with-panel" id="addShell">
      <div class="list-column">
        <div class="bottombar">
          <form id="quickAddForm">
            <input type="text" id="quickAddInput" placeholder="Quick add… milk, 1 gallon, fridge, dairy (tap the mic to dictate)">
          </form>
          <button type="button" id="scanBarBtn" class="secondary" aria-label="Scan a barcode" title="Scan a barcode"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
          <button type="button" id="openSheetBtn" aria-label="Add item">+</button>
        </div>

        <div id="itemGroups"></div>
      </div>

      <div class="sheet" id="itemSheet" hidden>
        <button class="sheet-close" type="button" id="closeSheetBtn">✕</button>
        <h2>Log a purchase</h2>
        <form id="itemForm">
          <div class="form-grid compact">
            <div class="barcode-row full">
              <input type="text" id="f-barcode" placeholder="Barcode (type or scan)" inputmode="numeric" autocomplete="off" aria-label="Barcode">
              <button type="button" id="scanBtn" class="scan-btn"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg> Scan</button>
              <!-- Opens the phone's own camera; the photo is read on the server. -->
              <input type="file" id="f-scan-file" accept="image/*" capture="environment" class="offscreen" tabindex="-1" aria-hidden="true">
            </div>
            <div id="scanStatus" class="scan-status full" role="status" hidden></div>
            <input type="text" id="f-name" placeholder="Item name" required class="full">
            <input type="number" id="f-quantity" placeholder="Qty" step="any" value="1">
            <input type="text" id="f-unit" placeholder="Unit (oz, lbs, count...)">
            <label class="full hidden" id="f-fill-wrap">Open one, % full <input type="number" id="f-fillpercent" placeholder="Fill %" min="0" max="100"></label>
            <select id="f-location-select" class="full">
              <option value="">Select location...</option>
              <option value="__new__">+ Add new location...</option>
            </select>
            <input type="text" id="f-location-new" placeholder="New location name" class="hidden full">
          </div>

          <button class="disclosure-toggle" type="button" data-toggle="moreFields">More fields ▾</button>
          <div class="form-grid" hidden id="moreFields">
            <select id="f-category">
              <option value="perishable">Perishable</option>
              <option value="nonperishable">Non-perishable</option>
            </select>
            <select id="f-tag-select">
              <option value="">Select tag...</option>
              <option value="__new__">+ Add new tag...</option>
            </select>
            <input type="text" id="f-tag-new" placeholder="New tag name" class="hidden full">
            <label class="full">Purchased <input type="date" id="f-purchase"></label>
            <label class="full">Expires <input type="date" id="f-expiration"></label>
            <input type="text" id="f-notes" placeholder="Notes" class="full">
          </div>

          <button type="submit" class="save-btn">Add item</button>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
