<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>BackOfFridge</h1>
    <div id="stats" class="stats"></div>
    <a href="glance.html">At a glance</a>
    <a href="locations.html">Manage locations</a>
    <a href="tags.html">Manage tags</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <section class="add-form">
      <h2>Log a purchase</h2>
      <form id="itemForm">
        <input type="text" id="f-name" placeholder="Item name" required>
        <select id="f-category">
          <option value="perishable">Perishable</option>
          <option value="nonperishable">Non-perishable</option>
        </select>
        <select id="f-location-select">
          <option value="">Select location...</option>
          <option value="__new__">+ Add new location...</option>
        </select>
        <input type="text" id="f-location-new" placeholder="New location name" class="hidden">
        <select id="f-tag-select">
          <option value="">Select tag...</option>
          <option value="__new__">+ Add new tag...</option>
        </select>
        <input type="text" id="f-tag-new" placeholder="New tag name" class="hidden">
        <input type="number" id="f-quantity" placeholder="Qty" step="any" value="1">
        <input type="text" id="f-unit" placeholder="Unit (oz, lbs, count...)">
        <label>Purchased <input type="date" id="f-purchase"></label>
        <label>Expires <input type="date" id="f-expiration"></label>
        <input type="text" id="f-notes" placeholder="Notes">
        <button type="submit">Add item</button>
      </form>
    </section>

    <section class="filters">
      <label><input type="checkbox" id="filterActiveOnly" checked> Active only</label>
      <label>Location: <select id="filterLocation"><option value="">All</option></select></label>
      <label>Tag: <select id="filterTag"><option value="">All</option></select></label>
      <input type="text" id="searchBox" placeholder="Search...">
      <label>Sort:
        <select id="sortBy">
          <option value="">Default</option>
          <option value="recent">Recently added</option>
          <option value="name">Name</option>
        </select>
      </label>
      <button id="refreshBtn">Refresh</button>
    </section>

    <section>
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Name</th><th>Category</th><th>Location</th><th>Tag</th><th>Qty</th>
            <th>Purchased</th><th>Expires</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
