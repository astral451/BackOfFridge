<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge - At a Glance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>At a Glance</h1>
    <a href="index.html">&larr; Full inventory</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <section class="filters">
      <label>Location: <select id="filterLocation"><option value="">All</option></select></label>
    </section>

    <table id="glanceTable">
      <thead>
        <tr><th>Name</th><th>Location</th><th>Expires</th><th>Count</th></tr>
      </thead>
      <tbody id="glanceBody"></tbody>
    </table>
  </main>

  <script src="glance.js"></script>
</body>
</html>
