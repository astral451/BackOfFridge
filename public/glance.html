<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// See index.html for why this runs inline, before the stylesheet.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge - At a Glance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>At a Glance</h1>
    <a href="index.html">&larr; Full inventory</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <section class="filters">
      <label>Location: <select id="filterLocation"><option value="">All</option></select></label>
    </section>

    <div id="itemGroups"></div>
  </main>

  <script src="connection.js"></script>
  <script src="glance.js"></script>
</body>
</html>
