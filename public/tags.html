<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// See index.html for why this runs inline, before the stylesheet.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackOfFridge - Tags</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Manage Tags</h1>
    <a href="index.html">&larr; Back to inventory</a>
    <span id="whoami" class="stats"></span>
    <button id="logoutBtn" class="small">Log out</button>
  </header>

  <main id="app">
    <form id="tagForm" class="manage-add">
      <input type="text" id="t-name" placeholder="New tag name" required>
      <button type="submit">+ Add</button>
    </form>

    <div id="tagsList"></div>
  </main>

  <script src="tags.js"></script>
</body>
</html>
